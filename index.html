<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BulScan Admin Scanner</title>

    <!-- QR SCANNER LIBRARY -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .scanner-container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #1a73e8;
            font-size: 21px;
        }

        .subtitle {
            font-size: 12px;
            color: #70757a;
            margin-bottom: 15px;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        #reader video {
            border-radius: 8px;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            background: #f8f9fa;
            color: #5f6368;
        }

        .result {
            margin-top: 15px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            background: #ffffff;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
            color: #137333;
            margin-bottom: 12px;
        }

        .result-row {
            margin-bottom: 9px;
        }

        .result-label {
            font-size: 11px;
            color: #70757a;
            display: block;
            margin-bottom: 2px;
        }

        .result-value {
            font-size: 14px;
            color: #202124;
            word-break: break-word;
        }

        .code-value {
            font-family: monospace;
            font-weight: 600;
            color: #1a73e8;
        }

        .invalid {
            background: #fce8e6;
            color: #c5221f;
            border: 1px solid #f5c2c0;
        }

        .success {
            background: #e6f4ea;
            color: #137333;
            border: 1px solid #b7dfc0;
        }

        .loading {
            background: #e8f0fe;
            color: #1967d2;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 5px;
            padding: 12px;
            margin-top: 15px;
            background: #1a73e8;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn:hover {
            background: #1557b0;
        }

        .hidden {
            display: none !important;
        }

    </style>

</head>

<body>

<div class="scanner-container">

    <h2>BulScan Scanner</h2>

    <div class="subtitle">
        Scan a BulScan QR Code to find the registered item.
    </div>


    <!-- CAMERA SCANNER -->

    <div id="reader"></div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >
        📷 Point the camera at a BulScan QR code.
    </div>


    <!-- RESULT -->

    <div
        id="result"
        class="result hidden"
    >

        <div class="result-title">
            ✅ Data Found
        </div>


        <div class="result-row">

            <span class="result-label">
                Code ID
            </span>

            <div
                id="result-code"
                class="result-value code-value"
            ></div>

        </div>


        <div class="result-row">

            <span class="result-label">
                Item
            </span>

            <div
                id="result-item"
                class="result-value"
            ></div>

        </div>


        <div class="result-row">

            <span class="result-label">
                Owner
            </span>

            <div
                id="result-owner"
                class="result-value"
            ></div>

        </div>


        <div class="result-row">

            <span class="result-label">
                Owner Email
            </span>

            <div
                id="result-email"
                class="result-value"
            ></div>

        </div>


        <div class="result-row">

            <span class="result-label">
                Status
            </span>

            <div
                id="result-status"
                class="result-value"
            ></div>

        </div>

    </div>


    <!-- SCAN AGAIN -->

    <button
        id="scan-again"
        class="btn hidden"
    >
        📷 Scan Another Code
    </button>

</div>


<script type="module">

    /* ==========================================
       FIREBASE IMPORTS
    ========================================== */

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getFirestore,
        collectionGroup,
        query,
        where,
        getDocs,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==========================================
       FIREBASE CONFIG
    ========================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCA_qDQVWsRoOrns--cvr3FlJS5yNNRCV0",

        authDomain:
            "bulscan-57052.firebaseapp.com",

        projectId:
            "bulscan-57052",

        storageBucket:
            "bulscan-57052.firebasestorage.app",

        messagingSenderId:
            "734717013691",

        appId:
            "1:734717013691:web:6afda3def2a6bca1d5839e",

        measurementId:
            "G-06X3YZ3VP4"

    };


    /* ==========================================
       INITIALIZE FIREBASE
    ========================================== */

    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    /* ==========================================
       ELEMENTS
    ========================================== */

    const status =
        document.getElementById("status");


    const result =
        document.getElementById("result");


    const scanAgain =
        document.getElementById("scan-again");


    let scanner = null;


    /* ==========================================
       SHOW STATUS
    ========================================== */

    function showStatus(message, type = "") {

        status.innerText = message;

        status.className =
            "status " + type;

    }


    /* ==========================================
       EXTRACT CODE ID
    ========================================== */

    function extractCodeID(text) {

        text = text.trim();


        /*
         * Normally the QR contains only:
         *
         * BUL-ABC12345
         */

        if (
            text.toUpperCase().startsWith("BUL-")
        ) {

            return text.trim();

        }


        /*
         * This also supports older QR codes
         * containing:
         *
         * CODE-ID: BUL-ABC12345
         */

        const match =
            text.match(
                /BUL-[A-Z0-9-]+/i
            );


        if (match) {

            return match[0].toUpperCase();

        }


        return null;

    }


    /* ==========================================
       SEARCH FIREBASE
    ========================================== */

    async function findCodeInFirebase(codeID) {

        /*
         * Search ALL "items" collections.
         *
         * This means:
         *
         * users/A/items
         * users/B/items
         * users/C/items
         *
         * are all searched.
         */

        const itemsQuery =
            query(
                collectionGroup(
                    db,
                    "items"
                ),
                where(
                    "qrCodeId",
                    "==",
                    codeID
                )
            );


        const snapshot =
            await getDocs(
                itemsQuery
            );


        /*
         * Nothing found
         */

        if (snapshot.empty) {

            return null;

        }


        /*
         * Get the first matching item
         */

        const itemDoc =
            snapshot.docs[0];


        const itemData =
            itemDoc.data();


        /*
         * Because the path is:
         *
         * users/{USER_ID}/items/{CODE_ID}
         *
         * the parent.parent gives us
         * the user document.
         */

        const userDocument =
            itemDoc.ref.parent.parent;


        if (!userDocument) {

            return null;

        }


        /*
         * Get owner information
         */

        const userSnapshot =
            await getDoc(
                userDocument
            );


        let ownerName =
            "Unknown Owner";

        let ownerEmail =
            "Unknown";


        if (userSnapshot.exists()) {

            const userData =
                userSnapshot.data();


            ownerName =
                userData.fullName ||
                "Unknown Owner";


            ownerEmail =
                userData.email ||
                "Unknown";

        }


        return {

            codeID:
                itemData.qrCodeId ||
                codeID,

            itemName:
                itemData.itemName ||
                "Unnamed Item",

            status:
                itemData.status ||
                "Unknown",

            ownerName:
                ownerName,

            ownerEmail:
                ownerEmail

        };

    }


    /* ==========================================
       DISPLAY RESULT
    ========================================== */

    function displayResult(data) {

        document
            .getElementById("result-code")
            .innerText =
            data.codeID;


        document
            .getElementById("result-item")
            .innerText =
            data.itemName;


        document
            .getElementById("result-owner")
            .innerText =
            data.ownerName;


        document
            .getElementById("result-email")
            .innerText =
            data.ownerEmail;


        document
            .getElementById("result-status")
            .innerText =
            data.status;


        result.classList.remove(
            "hidden"
        );


        scanAgain.classList.remove(
            "hidden"
        );

    }


    /* ==========================================
       QR WAS SCANNED
    ========================================== */

    async function handleScan(decodedText) {

        /*
         * Stop accepting additional scans
         */

        if (scanner) {

            try {

                await scanner.clear();

            }
            catch (error) {

                console.log(
                    "Scanner stopped."
                );

            }

        }


        const codeID =
            extractCodeID(
                decodedText
            );


        /*
         * INVALID QR FORMAT
         */

        if (!codeID) {

            showStatus(
                "❌ Data invalid",
                "invalid"
            );

            scanAgain.classList.remove(
                "hidden"
            );

            return;

        }


        /*
         * SEARCH DATABASE
         */

        showStatus(
            "🔎 Searching BulScan database...",
            "loading"
        );


        try {

            const data =
                await findCodeInFirebase(
                    codeID
                );


            /*
             * CODE DOES NOT EXIST
             */

            if (!data) {

                showStatus(
                    "❌ Data invalid",
                    "invalid"
                );

                scanAgain.classList.remove(
                    "hidden"
                );

                return;

            }


            /*
             * FOUND
             */

            showStatus(
                "✅ QR code verified.",
                "success"
            );


            displayResult(
                data
            );


        }
        catch (error) {

            console.error(
                "Firebase search error:",
                error
            );


            showStatus(
                "❌ Unable to search database.",
                "invalid"
            );


            scanAgain.classList.remove(
                "hidden"
            );

        }

    }


    /* ==========================================
       START SCANNER
    ========================================== */

    function startScanner() {

        result.classList.add(
            "hidden"
        );


        scanAgain.classList.add(
            "hidden"
        );


        showStatus(
            "📷 Point the camera at a BulScan QR code."
        );


        scanner =
            new Html5Qrcode(
                "reader"
            );


        scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            (decodedText) => {

                handleScan(
                    decodedText
                );

            },

            (errorMessage) => {

                /*
                 * Normal camera scanning produces
                 * many "not found" messages.
                 *
                 * We intentionally don't display them.
                 */

            }

        )
        .catch(
            (error) => {

                console.error(
                    error
                );


                showStatus(
                    "❌ Camera could not be opened. Please allow camera permission.",
                    "invalid"
                );

            }
        );

    }


    /* ==========================================
       SCAN AGAIN
    ========================================== */

    scanAgain.addEventListener(
        "click",
        () => {

            if (scanner) {

                try {

                    scanner.clear();

                }
                catch (error) {}

            }


            startScanner();

        }
    );


    /* ==========================================
       START WHEN PAGE LOADS
    ========================================== */

    startScanner();

</script>

</body>
</html>
